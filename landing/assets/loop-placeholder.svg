<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-labelledby="title desc">
  <title id="title">Loop screenshot placeholder</title>
  <desc id="desc">Placeholder for a Loop screenshot</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E8EEF7"/>
    </linearGradient>
  </defs>
  <rect width="420" height="560" rx="28" fill="#0F172A"/>
  <rect x="8" y="8" width="404" height="544" rx="22" fill="url(#bg)"/>
  <text x="210" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">Loop</text>
  <text x="210" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B7280">Screenshot coming soon</text>

  <rect x="36" y="140" width="348" height="160" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="100" y="180" width="220" height="80" rx="10" fill="rgba(255,59,48,0.12)" stroke="#FF3B30" stroke-dasharray="6 4"/>
  <text x="210" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FF3B30">Loop region</text>
  <text x="210" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#6B7280">Timeline repeat</text>

</svg>
