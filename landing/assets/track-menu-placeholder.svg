<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-labelledby="title desc">
  <title id="title">Track menu screenshot placeholder</title>
  <desc id="desc">Placeholder for a Track menu screenshot</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E8EEF7"/>
    </linearGradient>
  </defs>
  <rect width="420" height="560" rx="28" fill="#0F172A"/>
  <rect x="8" y="8" width="404" height="544" rx="22" fill="url(#bg)"/>
  <text x="210" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1B2A4A">Long press track menu</text>
  <text x="210" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B7280">Screenshot coming soon</text>

  <rect x="36" y="120" width="348" height="72" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="52" y="148" width="180" height="10" rx="5" fill="#1B2A4A"/>
  <rect x="120" y="210" width="220" height="260" rx="16" fill="#1B2A4A"/>
  <text x="230" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Rename Track</text>
  <text x="230" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#CBD5E1">Change Color</text>
  <text x="230" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#CBD5E1">Loop Track</text>
  <text x="230" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#CBD5E1">Merge</text>
  <text x="230" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#CBD5E1">Export Track</text>
  <text x="230" y="425" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#FF3B30">Delete Track</text>

</svg>
